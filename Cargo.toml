[package]
name = "ratatui_demo"
version = "0.1.0"
edition = "2024"
description = "A Ratatui widget-demo TUI that doubles as a live system monitor."
repository = "https://github.com/danieldecena/ratatui_demo"
license = "MIT"
readme = "README.md"
keywords = ["tui", "terminal", "ratatui", "monitor", "dashboard"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.32"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.39.5"
tokio = { version = "1.52.3", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
